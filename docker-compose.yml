version: '3.8'

# Minabox - Complete Service Stack
# =================================
# Dieses docker-compose.yml startet alle Minabox-Services:
# - MQTT Broker (Mosquitto)
# - Backend-Service (API, WebSocket, DB)
# - WebUI-Service (Nginx)
# - RFID-Service (Hardware)
# - Audio-Service (GStreamer)
# - Button-Service (Hardware)
# - LED-Service (Hardware)

services:

  # =================================
  # Infrastructure: MQTT Broker
  # =================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: minabox-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - minabox-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================
  # Backend Service
  # =================================
  backend:
    build:
      context: ./services/backend-service
      dockerfile: Dockerfile
    container_name: minabox-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # MQTT
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:-box1}
      
      # Database
      - DATABASE_PATH=/data/minabox.db
      
      # Storage
      - AUDIO_STORAGE_PATH=/mnt/audio/tracks
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # API
      - API_PORT=8080
      - WS_ENABLED=true
    volumes:
      - ./data:/data
      - ./audio:/mnt/audio
      - ./services/backend-service/config:/app/config:ro
    networks:
      - minabox-network
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # WebUI Service
  # =================================
  webui:
    build:
      context: ./services/webui-service
      dockerfile: Dockerfile
    container_name: minabox-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-80}:80"
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =================================
  # RFID Service (Hardware)
  # =================================
  rfid:
    build:
      context: ./services/rfid-service
      dockerfile: Dockerfile
    container_name: minabox-rfid
    restart: unless-stopped
    environment:
      # MQTT
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:-box1}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/rfid-service/config:/app/config
    networks:
      - minabox-network
    depends_on:
      mosquitto:
        condition: service_healthy
    # Hardware-Zugriff für I2C/SPI (RFID-Reader)
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/spidev0.0:/dev/spidev0.0
    # Alternative: privileged mode (weniger sicher, aber einfacher)
    # privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # Audio Service
  # =================================
  audio:
    build:
      context: ./services/audio-service
      dockerfile: Dockerfile
    container_name: minabox-audio
    restart: unless-stopped
    environment:
      # MQTT
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:-box1}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Audio
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - ./services/audio-service/config:/app/config
      - ./audio:/mnt/audio:ro
      # PulseAudio Socket (falls verwendet)
      - /run/user/1000/pulse:/run/user/1000/pulse:ro
    networks:
      - minabox-network
    depends_on:
      mosquitto:
        condition: service_healthy
    # Audio-Device-Zugriff
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # Button Service (Hardware)
  # =================================
  button:
    build:
      context: ./services/button-service
      dockerfile: Dockerfile
    container_name: minabox-button
    restart: unless-stopped
    environment:
      # MQTT
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:-box1}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/button-service/config:/app/config
    networks:
      - minabox-network
    depends_on:
      mosquitto:
        condition: service_healthy
    # GPIO-Zugriff
    devices:
      - /dev/gpiomem:/dev/gpiomem
    # Alternative: privileged mode
    # privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # LED Service (Hardware)
  # =================================
  led:
    build:
      context: ./services/led-service
      dockerfile: Dockerfile
    container_name: minabox-led
    restart: unless-stopped
    environment:
      # MQTT
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:-box1}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/led-service/config:/app/config
    networks:
      - minabox-network
    depends_on:
      mosquitto:
        condition: service_healthy
    # GPIO-Zugriff
    devices:
      - /dev/gpiomem:/dev/gpiomem
    # Alternative: privileged mode
    # privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# =================================
# Networks
# =================================
networks:
  minabox-network:
    driver: bridge
    name: minabox-network

# =================================
# Volumes
# =================================
volumes:
  mosquitto_data:
    name: minabox-mosquitto-data
  mosquitto_log:
    name: minabox-mosquitto-log
