[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "media-downloader-service"
dynamic = ["version"]
description = "Minabox Media Downloader Service – local media import from a URL"
requires-python = ">=3.13"

# Die Version steht in der Datei VERSION - eine Quelle je Dienst
# (docs/Versionierung.md). Frueher stand sie hier ein zweites Mal
# und war repo-weit veraltet.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
