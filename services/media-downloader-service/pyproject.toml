[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "media-downloader-service"
dynamic = ["version"]
description = "Minabox Media Downloader Service – local media import from a URL"
requires-python = ">=3.13"

# The version lives in the VERSION file - one source per service
# (docs/Versionierung.md). It used to be duplicated here and was
# stale repo-wide.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
