events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Serve pre-built .gz files from vite-plugin-compression directly instead of
    # compressing on every request (saves CPU on the Pi). Falls back to dynamic
    # gzip below for anything without a pre-built .gz sibling (e.g. /api/ JSON).
    gzip_static on;

    # Gzip compression (fallback for responses without a pre-built .gz file)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Root for static files
        root /usr/share/nginx/html;
        index index.html;

        # Docker embedded DNS. Using a variable in proxy_pass (below) forces nginx
        # to resolve "backend" at request time instead of once at config load, so
        # a rebuilt backend container (new IP) doesn't leave nginx stuck proxying
        # to a stale, no-longer-existing address (permanent 502s until this
        # container is restarted). This also lets webui start before/without the
        # backend being healthy, since it no longer needs the IP at startup.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # SPA routing: all requests fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static user files (logo, playlist covers) served by backend.
        # ^~ prevents the image-regex location below from intercepting these URLs.
        location ^~ /static/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-cache";
        }

        # API reverse proxy to backend service
        location /api/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward session cookies from backend to browser unchanged.
            # Without this nginx silently drops Set-Cookie response headers
            # from the proxied backend, so login/password endpoints never
            # deliver the minabox_session cookie to the client.
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / "/; SameSite=Lax";

            # Increase timeout for large file uploads
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 100m;
        }

        # WebSocket reverse proxy to backend service
        location /ws {
            proxy_pass $backend_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket keepalive
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Translations: stable URLs without a content hash, so a rebuilt image
        # keeps the same path. Without an explicit header they get no
        # Cache-Control at all and browsers fall back to heuristic caching -
        # which serves a stale admin.json long after the file changed, and looks
        # exactly like "the translations are broken". "no-cache" still caches,
        # but forces revalidation against the ETag (cheap 304s).
        location ^~ /locales/ {
            add_header Cache-Control "no-cache";
        }

        # Cache for static assets (Vite generates content-hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Do not cache index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Health check endpoint for Docker
        location /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
