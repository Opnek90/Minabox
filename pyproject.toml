# Test and lint tooling. Service runtime deps live in services/*/requirements.txt.
# Install with: pip install --group dev
[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.2",
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<2.0",
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["services"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
