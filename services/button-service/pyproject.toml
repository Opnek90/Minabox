[project]
name = "button_service"
version = "0.1.0"
description = "Minabox button service for GPIO-based buttons and rotary encoders."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.0,<2.13.0",
    "structlog>=25.5.0,<25.6.0",
    "gpiozero>=2.0.1,<2.1.0",
    "RPi.GPIO>=0.7.1,<0.8.0",
    "aiomqtt>=2.5.0,<2.6.0",
    "tenacity>=9.1.4,<9.2.0",
    "fastapi>=0.129.0,<0.130.0",
    "uvicorn[standard]>=0.41.0,<0.42.0",
]

[project.scripts]
button-service = "button_service.main:run"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
