[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-service"
dynamic = ["version"]
description = "Minabox Audio Service - VLC-based audio player with MQTT control"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.126.0,<0.127.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.12.0,<2.13.0",
    "aiomqtt>=2.5.0,<2.6.0",
    "python-vlc>=3.0.21203,<4.0.0",
    "structlog>=25.4.0,<25.5.0",
    "minabox-shared @ file:../shared-lib",
]

[project.scripts]
audio-service = "audio_service.main:run"

# Die Version steht in der Datei VERSION - eine Quelle je Dienst
# (docs/Versionierung.md). Frueher stand sie hier ein zweites Mal
# und war repo-weit veraltet.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "vlc.*"
ignore_missing_imports = true
ignore_errors = true
