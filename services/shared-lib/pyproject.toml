[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minabox-shared"
dynamic = ["version"]
description = "Shared config, exceptions and MQTT base for Minabox services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "aiomqtt>=2.0",
]

# Die Version steht in der Datei VERSION - eine Quelle je Dienst
# Frueher stand sie hier ein zweites Mal
# und war repo-weit veraltet.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_lib*"]
