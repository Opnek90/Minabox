[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "display-service"
version = "0.1.0"
description = "Minabox display service for I2C OLED (SSD1306) status display."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.126.0,<0.127.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.12.0,<2.13.0",
    "aiomqtt>=2.5.0,<2.6.0",
    "structlog>=25.4.0,<25.5.0",
    "tenacity>=9.0.0,<10.0.0",
    "httpx>=0.28.0,<0.29.0",
    "luma.oled>=3.13.0,<3.15.0",
    "Pillow>=11.0.0,<12.0.0",
    "minabox-shared @ file:../shared-lib",
]

[project.scripts]
display-service = "display_service.main:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
