events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Root for static files
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing: all requests fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API reverse proxy to backend service
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Increase timeout for large file uploads
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 100m;
        }

        # WebSocket reverse proxy to backend service
        location /ws {
            proxy_pass http://backend:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket keepalive
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Cache for static assets (Vite generates content-hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Do not cache index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Health check endpoint for Docker
        location /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
