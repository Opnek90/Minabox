# Security headers, included in every block that sets add_header of its own.
#
# nginx does NOT inherit add_header into a block that defines its own - so a
# location with a Cache-Control header silently loses everything set further
# up. That is why this file is included six times instead of once.
#
# Deliberately not here: Content-Security-Policy. MUI and Emotion write inline
# styles at runtime, so a CSP needs at least style-src 'self' 'unsafe-inline',
# and streams pull audio and cover art from arbitrary hosts. A wrong CSP whites
# out the whole interface, so it wants its own change with a click-through.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
