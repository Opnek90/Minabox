[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-service"
version = "0.1.0"
description = "Minabox Backend Service - Central orchestration and data management"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.126.0,<0.127.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.12.0,<2.13.0",
    "sqlalchemy>=2.0.46,<2.1.0",
    "alembic>=1.15.0,<2.0.0",
    "aiomqtt>=2.5.0,<2.6.0",
    "structlog>=25.4.0,<25.5.0",
    "tenacity>=9.0.0,<10.0.0",
    "mutagen>=1.47.0,<2.0.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
backend-service = "backend_service.main:run"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
