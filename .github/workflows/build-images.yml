name: Build & Push Images

# Baut alle Minabox-Service-Images und schiebt sie nach GHCR.
# Der Installations-Wizard (install.sh) laedt ausschliesslich von dort -
# ohne diesen Workflow gibt es nichts zu pullen.
#
# Einmalig nach dem ersten erfolgreichen Lauf noetig: die Packages unter
# github.com/users/Opnek90/packages auf "public" stellen, sonst verlangt
# "docker pull" auf dem Pi ein Login.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Nativer arm64-Runner. Das ist hier nicht Kosmetik: led- und
    # button-service kompilieren lgpio aus dem Quelltext und webui baut mit
    # npm - unter QEMU dauert das ein Vielfaches und laeuft ins Job-Timeout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Acht Services bauen aus ./services, weil sie shared-lib brauchen.
          - { name: backend,          image: minabox-backend,          context: ./services, dockerfile: ./services/backend-service/Dockerfile }
          - { name: host-helper,      image: minabox-host-helper,      context: ./services, dockerfile: ./services/host-helper-service/Dockerfile }
          - { name: audio,            image: minabox-audio,            context: ./services, dockerfile: ./services/audio-service/Dockerfile }
          - { name: rfid,             image: minabox-rfid,             context: ./services, dockerfile: ./services/rfid-service/Dockerfile }
          - { name: button,           image: minabox-button,           context: ./services, dockerfile: ./services/button-service/Dockerfile }
          - { name: led,              image: minabox-led,              context: ./services, dockerfile: ./services/led-service/Dockerfile }
          - { name: display,          image: minabox-display,          context: ./services, dockerfile: ./services/display-service/Dockerfile }
          - { name: media-downloader, image: minabox-media-downloader, context: ./services, dockerfile: ./services/media-downloader-service/Dockerfile }
          # webui hat einen eigenen, engeren Context (kein shared-lib).
          - { name: webui,            image: minabox-webui,            context: ./services/webui-service, dockerfile: ./services/webui-service/Dockerfile }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Jeder Dienst traegt seine eigene Version in services/<name>-service/VERSION.
      # Sie wird zum Image-Tag *und* zum Build-Arg - dieselbe Zahl steht damit
      # in der Registry und im OCI-Label des Images (docs/Versionierung.md).
      - name: Read service version
        id: ver
        run: |
          set -euo pipefail
          file="services/${{ matrix.name }}-service/VERSION"
          version="$(tr -d '[:space:]' < "$file")"
          # Fruehes, lautes Scheitern: eine kaputte VERSION-Datei wuerde sonst
          # ein Image mit sinnlosem Tag in die Registry schieben.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=$file::'$version' ist keine gueltige SemVer-Version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR verlangt kleingeschriebene Pfade.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Kein "labels:" aus metadata-action: dessen
          # org.opencontainers.image.version leitet sich vom Git-Ref ab (bei
          # einem main-Push also "main") und wuerde das Label ueberschreiben,
          # das der Dockerfile aus APP_VERSION setzt. Die Labels gehoeren hier
          # dem Dockerfile, damit ein lokaler Build dieselbe Struktur erzeugt.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
