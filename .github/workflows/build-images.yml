name: Build & Push Images

# Baut die Minabox-Service-Images und schiebt sie nach GHCR.
# Der Installations-Wizard (install.sh) laedt ausschliesslich von dort -
# ohne diesen Workflow gibt es nichts zu pullen.
#
# Gebaut wird nur, was sich geaendert hat. Jeder Dienst traegt seine eigene
# Version in services/<dienst>-service/VERSION (docs/Versionierung.md); ein
# unveraenderter Dienst darf nicht neu unter seiner alten Nummer landen, sonst
# zeigt derselbe Tag auf verschiedene Staende und die Versionsanzeige in der
# WebUI wird wertlos.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Alle Dienste bauen, unabhaengig von den Aenderungen"
        type: boolean
        default: true

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Welche Dienste muessen gebaut werden? ─────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie: ohne sie gibt es keinen Vergleichspunkt fuer das
          # Diff gegen den vorherigen Stand.
          fetch-depth: 0

      - name: Select services
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          BUILD_ALL: ${{ github.event_name != 'push' || inputs.build_all }}
        run: python3 .github/scripts/select_services.py

  # ── Bauen und pushen ──────────────────────────────────────────────────────
  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    # Nativer arm64-Runner. Das ist hier nicht Kosmetik: led- und
    # button-service kompilieren lgpio aus dem Quelltext und webui baut mit
    # npm - unter QEMU dauert das ein Vielfaches und laeuft ins Job-Timeout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Die Version wird zum Image-Tag *und* zum Build-Arg - dieselbe Zahl
      # steht damit in der Registry und im OCI-Label des Images.
      - name: Read service version
        id: ver
        run: |
          set -euo pipefail
          file="services/${{ matrix.name }}-service/VERSION"
          version="$(tr -d '[:space:]' < "$file")"
          # Fruehes, lautes Scheitern: eine kaputte VERSION-Datei wuerde sonst
          # ein Image mit sinnlosem Tag in die Registry schieben.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=$file::'$version' ist keine gueltige SemVer-Version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      # Ein Versions-Tag ist unveraenderlich. Existiert er schon und stammt aus
      # einem anderen Commit, wurde die VERSION-Datei nicht angehoben - dann
      # bricht der Lauf ab, statt die vorhandene Nummer zu ueberschreiben.
      # Derselbe Commit darf durch: das ist ein Neulauf desselben Standes.
      - name: Ensure version tag is free
        env:
          # Ein Lauf von Hand ist eine bewusste Entscheidung - dort warnt der
          # Wachposten nur. Auf einem Push ist ein vergebener Tag dagegen ein
          # vergessener Versions-Bump und bricht den Lauf ab.
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          if ! out="$(docker buildx imagetools inspect "$ref" \
                --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null)"; then
            echo "Tag $ref ist frei."
            exit 0
          fi
          if [ "$out" = "${{ github.sha }}" ]; then
            echo "Tag $ref stammt aus diesem Commit - Neulauf, wird neu geschrieben."
            exit 0
          fi
          msg="Version ${{ steps.ver.outputs.version }} von ${{ matrix.name }} ist bereits vergeben (aus Commit ${out:-unbekannt}). Bitte services/${{ matrix.name }}-service/VERSION anheben."
          if [ "$MANUAL" = "true" ]; then
            echo "::warning file=services/${{ matrix.name }}-service/VERSION::$msg Manueller Lauf - wird ueberschrieben."
            exit 0
          fi
          echo "::error file=services/${{ matrix.name }}-service/VERSION::$msg"
          exit 1

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR verlangt kleingeschriebene Pfade.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Kein "labels:" aus metadata-action: dessen
          # org.opencontainers.image.version leitet sich vom Git-Ref ab (bei
          # einem main-Push also "main") und wuerde das Label ueberschreiben,
          # das der Dockerfile aus APP_VERSION setzt. Die Labels gehoeren hier
          # dem Dockerfile, damit ein lokaler Build dieselbe Struktur erzeugt.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
