[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minabox-shared"
version = "0.1.0"
description = "Shared config, exceptions and MQTT base for Minabox services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "aiomqtt>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_lib*"]
