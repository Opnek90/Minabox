# Minabox - Complete Service Stack
# =================================
# Dieses docker-compose.yml startet alle Minabox-Services:
# - MQTT Broker (Mosquitto)
# - Backend-Service (API, WebSocket, DB)
# - WebUI-Service (Nginx)
# - RFID-Service (Hardware)
# - Audio-Service (VLC via PipeWire/Pulse)
# - Button-Service (Hardware)
# - LED-Service (Hardware)
# - Media-Downloader-Service (Medienimport von URL)
#
# REQUIRED environment variables (.env file):
# - MQTT_BROKER: MQTT broker hostname (e.g., 'mqtt')
# - MQTT_PORT: MQTT broker port (e.g., 1883)
# - MINABOX_DEVICE_ID: Device ID for MQTT topics (e.g., 'box1')
# - LOG_LEVEL: Logging level (DEBUG, INFO, WARNING, ERROR)
#
# Optional environment variables:
# - BACKEND_PORT: Backend API port (default: 8080)
# - WEBUI_PORT: WebUI port (default: 80)
# - AUDIO_FILES_PATH: Path to audio files on the host (default: ./audio)
# - DISABLE_GPIO: Set to 'true' to disable GPIO (e.g. for dev without hardware)
# - HOST_HELPER_API_KEY: API key for Backend <-> Host-Helper (required for media path / move)
#
# Startup order (depends_on with condition: service_healthy):
#   1. mqtt        – Message bus; everything depends on it
#   2. backend     – Central data store; starts after mqtt is healthy
#   3. audio, host-helper, rfid, button, led, display, media-downloader –
#      start after backend is healthy (in parallel with each other)
#   4. webui – starts last, after audio and every enabled peripheral service
#      (rfid, button, led, display, media-downloader) is healthy, so its
#      features don't fail just because the box is still booting
#
# Resource limits: omitted by default because on many Raspberry Pi setups the
# kernel has cgroup memory disabled, which causes "Limitation discarded" warnings.
# To enable memory limits on Pi: add cgroup_memory=1 to /boot/firmware/cmdline.txt
# (or /boot/cmdline.txt), then reboot. Then you can add deploy.resources per service.

# Logging: the json-file driver defaults to unlimited growth, and the box runs
# from an SD card. Ten megabytes per service across three files caps the whole
# stack at roughly 300 MB and keeps enough history for a debug export.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # =================================
  # Infrastructure: MQTT Broker
  # =================================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: minabox-mqtt
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:?MQTT_PORT must be set in .env}:1883"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - minabox-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================
  # Backend Service
  # =================================
  backend:
    image: ghcr.io/opnek90/minabox-backend:${MINABOX_BACKEND_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: backend-service/Dockerfile
    container_name: minabox-backend
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - DATABASE_PATH=/data/minabox.db
      - AUDIO_STORAGE_PATH=/mnt/audio/tracks
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - API_PORT=8080
      - WS_ENABLED=true
      - CONFIG_SERVICES_PATH=/app/config_services
      - DISABLE_GPIO=${DISABLE_GPIO:-false}
      - STATIC_DIR=/data/static
      - HOST_HELPER_URL=http://host-helper:8000
      - HOST_HELPER_API_KEY=${HOST_HELPER_API_KEY:-}
      - WEB_AUTH_SECRET=${WEB_AUTH_SECRET:-}
      - ALLOWED_AUDIO_PATHS=${ALLOWED_AUDIO_PATHS:-/media,/mnt,/home/pi}
      - MEDIA_DOWNLOADER_URL=http://media-downloader:8007
      - HOST_DIAG_ROOT=/host
      # Where the update check reads the release manifest. Set here so a running
      # container picks up a moved path on a plain `compose up -d`, without
      # waiting for a new backend image. Overridable via .env for a fork.
      - MINABOX_MANIFEST_URL=${MINABOX_MANIFEST_URL:-https://raw.githubusercontent.com/Opnek90/Minabox/main/release/release-manifest.json}
      # Which optional components this box has. Compose reads this from .env to
      # decide which services to start; the backend reads it to hide what is not
      # installed from the WebUI.
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    volumes:
      - ./data:/data
      - ${AUDIO_FILES_PATH:-./audio}:/mnt/audio
      - ./services/backend-service/config:/app/config:ro
      - ./services/audio-service/config:/app/config_services/audio
      - ./services/led-service/config:/app/config_services/led
      - ./services/button-service/config:/app/config_services/button
      - ./services/rfid-service/config:/app/config_services/rfid
      - ./services/display-service/config:/app/config_services/display
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only host files for the debug export (docs/DebugExport.md 4.3).
      # Reading these here keeps the collectors out of the root-privileged
      # Host-Helper. Nothing writable, nothing secret: no /etc/shadow, no
      # /etc/ssh, no /root, no /home, no /var/lib/docker.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/rpi-issue:/host/etc/rpi-issue:ro
      - /etc/timezone:/host/etc/timezone:ro
      - ${BOOT_CONFIG_DIR:-/boot/firmware}:/host/boot:ro
      - /var/lib/dpkg/status:/host/var/lib/dpkg/status:ro
      - /var/log/apt:/host/var/log/apt:ro
    group_add:
      # GID der Host-Gruppe "docker" - nur damit ist der read-only gemountete
      # /var/run/docker.sock lesbar. Der Wert ist hostabhaengig (hier 984), die
      # frueher fest verdrahtete 999 passte nicht und der Docker-Collector lief
      # in PermissionError(13). Ermitteln mit:
      #   getent group docker | cut -d: -f3
      - "${DOCKER_GID:-984}"
    networks:
      - minabox-network
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # Host-Helper (internal; .env write, optional move)
  # =================================
  host-helper:
    image: ghcr.io/opnek90/minabox-host-helper:${MINABOX_HOST_HELPER_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: host-helper-service/Dockerfile
    container_name: minabox-host-helper
    logging: *default-logging
    restart: unless-stopped
    user: "0:0"
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HOST_HELPER_API_KEY=${HOST_HELPER_API_KEY:?HOST_HELPER_API_KEY must be set in .env}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-minabox}
      - ENV_FILE_PATH=/workspace/.env
      - ALLOWED_BASE_PATHS=${ALLOWED_AUDIO_PATHS:-/media,/mnt,/home/pi}
      - HOST_PROC=/host/proc
      - HOST_ETC_HOSTNAME=/host/etc/hostname
      - HOST_ROOT=/host
      - HOST_IP=${HOST_IP:-}
      - WORKSPACE_PATH=/workspace
      - DATA_PATH=/workspace/data
      - AUDIO_STORAGE_PATH=/workspace/audio
    volumes:
      - .:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /:/host:rw
    group_add:
      # GID der Host-Gruppe "docker" - nur damit ist der read-only gemountete
      # /var/run/docker.sock lesbar. Der Wert ist hostabhaengig (hier 984), die
      # frueher fest verdrahtete 999 passte nicht und der Docker-Collector lief
      # in PermissionError(13). Ermitteln mit:
      #   getent group docker | cut -d: -f3
      - "${DOCKER_GID:-984}"
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =================================
  # Audio Service (VLC via PipeWire/Pulse)
  # =================================
  audio:
    image: ghcr.io/opnek90/minabox-audio:${MINABOX_AUDIO_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: audio-service/Dockerfile
    container_name: minabox-audio
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Nur auf dem Loopback veroeffentlicht. Die REST-API kennt keine
      # Authentifizierung, und /switch-device sowie /test-tone veraendern den
      # Zustand bzw. machen Geraeusch - das muss nicht aus dem WLAN erreichbar
      # sein. Das Backend spricht den Dienst ueber das Compose-Netz an
      # (http://audio:8003), Diagnose per curl auf der Box bleibt moeglich.
      - "127.0.0.1:8003:8003"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - AUDIO_SERVICE_HOST=0.0.0.0
      - AUDIO_SERVICE_PORT=8003
      - AUDIO_CONFIG_PATH=config/audio.json
      - AUDIO_STATE_PATH=state/audio_state.json
      - XDG_RUNTIME_DIR=/run/user/${HOST_UID:-1000}
      - PULSE_SERVER=unix:/run/user/${HOST_UID:-1000}/pulse/native
      - PULSE_PROP_module-suspend-on-idle.timeout=0
      # Only reaches the pacat prewarm, not the music: libVLC sets its own
      # media role and this variable does not override it. The role the music
      # runs under is pinned with --role=music in _build_vlc_args() - it has to
      # be, because WirePlumber remembers mute per role and a role nobody
      # meant to use kept the box silent across reboots.
      - PULSE_PROP_media.role=music
    volumes:
      - ./services/audio-service/config:/app/config
      - ./services/audio-service/state:/app/state
      - ${AUDIO_FILES_PATH:-./audio}:/mnt/audio:ro
      - /run/user/${HOST_UID:-1000}/pulse:/run/user/${HOST_UID:-1000}/pulse:ro
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # RFID Service (Hardware)
  # =================================
  rfid:
    profiles: ["rfid"]
    image: ghcr.io/opnek90/minabox-rfid:${MINABOX_RFID_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: rfid-service/Dockerfile
    container_name: minabox-rfid
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Bound to localhost: /health is unauthenticated, and the backend talks
      # to the service over the compose network (http://rfid:8000).
      # Diagnosis with curl on the box stays possible.
      - "127.0.0.1:8001:8000"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - DISABLE_GPIO=${DISABLE_GPIO:-false}
    volumes:
      - ./services/rfid-service/config:/app/config
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    devices:
      - /dev/i2c-1:/dev/i2c-1
    user: "${HOST_UID:-1000}:${I2C_GID:-988}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # Button Service (Hardware)
  # =================================
  button:
    profiles: ["button"]
    image: ghcr.io/opnek90/minabox-button:${MINABOX_BUTTON_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: button-service/Dockerfile
    container_name: minabox-button
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Bound to localhost: /health is unauthenticated, and the backend talks
      # to the service over the compose network (http://button:8000).
      # Diagnosis with curl on the box stays possible.
      - "127.0.0.1:8005:8000"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - DISABLE_GPIO=${DISABLE_GPIO:-false}
      - GPIOZERO_PIN_FACTORY=lgpio
    volumes:
      - ./services/button-service/config:/app/config
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${GPIO_GID:-986}"
    group_add:
      - "${GPIO_GID:-986}"
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiomem:/dev/gpiomem
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # LED Service (Hardware)
  # =================================
  led:
    profiles: ["led"]
    image: ghcr.io/opnek90/minabox-led:${MINABOX_LED_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: led-service/Dockerfile
    container_name: minabox-led
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Bound to localhost: POST /test is unauthenticated, and the backend
      # talks to the service over the compose network (http://led:8000).
      # Diagnosis with curl on the box stays possible.
      - "127.0.0.1:8004:8000"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - DISABLE_GPIO=${DISABLE_GPIO:-false}
      - GPIOZERO_PIN_FACTORY=lgpio
    volumes:
      - ./services/led-service/config:/app/config:ro
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiomem:/dev/gpiomem
    user: "${HOST_UID:-1000}:${GPIO_GID:-986}"
    group_add:
      - "${GPIO_GID:-986}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # Display Service (I2C OLED)
  # =================================
  display:
    profiles: ["display"]
    image: ghcr.io/opnek90/minabox-display:${MINABOX_DISPLAY_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: display-service/Dockerfile
    container_name: minabox-display
    logging: *default-logging
    restart: unless-stopped
    # DISPLAY_API_PORT feeds the container port, the published port and the
    # health check from one place. The service validates API_PORT (1024-65535)
    # and binds it, so the three could previously disagree: setting it left the
    # container permanently unhealthy against a hardcoded 8000.
    ports:
      # Bound to localhost: /health is unauthenticated, and the backend talks
      # to the service over the compose network (http://display:8000).
      # Diagnosis with curl on the box stays possible.
      - "127.0.0.1:8006:${DISPLAY_API_PORT:-8000}"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER must be set in .env}
      - MQTT_PORT=${MQTT_PORT:?MQTT_PORT must be set in .env}
      - MINABOX_DEVICE_ID=${MINABOX_DEVICE_ID:?MINABOX_DEVICE_ID must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - BACKEND_URL=http://backend:8080
      - API_PORT=${DISPLAY_API_PORT:-8000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./services/display-service/config:/app/config:ro
    networks:
      - minabox-network
    depends_on:
      mqtt:
        condition: service_healthy
      backend:
        condition: service_healthy
    devices:
      - /dev/i2c-1:/dev/i2c-1
    user: "${HOST_UID:-1000}:${I2C_GID:-988}"
    healthcheck:
      # curl is the project-wide healthcheck. A Python one-liner would save the
      # ~15 MB curl layer but cost ~6 % of a core, because python:3.13-slim
      # ships no stdlib bytecode and this container runs unprivileged.
      test: ["CMD-SHELL", "curl -f http://localhost:${DISPLAY_API_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # =================================
  # WebUI Service
  # =================================
  webui:
    image: ghcr.io/opnek90/minabox-webui:${MINABOX_WEBUI_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services/webui-service
      dockerfile: Dockerfile
    container_name: minabox-webui
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-80}:80"
    networks:
      - minabox-network
    # service_started for host-helper, not service_healthy: nginx resolves
    # "backend" at request time via the resolver directive in nginx.conf (not
    # once at config load), so the UI doesn't need the backend container itself
    # to exist yet to start — ConnectionLostScreen covers the case where the
    # backend isn't reachable yet. The hardware/peripheral services are
    # different: those don't have an equivalent fallback screen, so features
    # that talk to them (Audio, RFID, LED, Display, Media-Downloader) failed
    # visibly right after boot when webui came up before those containers were
    # healthy. Waiting for them (required: false, since the hardware ones are
    # profile-gated and may not be started at all) pushes webui's own start a
    # bit later without making it as strict as service_healthy on itself.
    depends_on:
      host-helper:
        condition: service_started
      audio:
        condition: service_healthy
      rfid:
        condition: service_healthy
        required: false
      button:
        condition: service_healthy
        required: false
      led:
        condition: service_healthy
        required: false
      display:
        condition: service_healthy
        required: false
      media-downloader:
        condition: service_healthy
        required: false
    # wget, not curl: the webui image is nginx:alpine-slim, which ships BusyBox
    # wget and no curl at all. It is the one exception to the project-wide curl
    # healthcheck. This block repeats what the Dockerfile already declares,
    # because compose overrides it either way - so the two must not drift apart.
    #
    # 127.0.0.1, not localhost: BusyBox wget tries ::1 first and gives up when
    # it is refused, and nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # Media-Downloader Service
  # ------------------------------------------------------------
  # Imports the audio track of a URL into the local library. The domain
  # allow-list lives in the backend (Admin UI -> General -> media import),
  # not here - it is a technical guard against arbitrary fetch targets, not
  # a legal clearance of the content hosted there. See README.md.
  # ============================================================
  media-downloader:
    profiles: ["media"]
    image: ghcr.io/opnek90/minabox-media-downloader:${MINABOX_MEDIA_DOWNLOADER_TAG:-${MINABOX_IMAGE_TAG:-latest}}
    build:
      context: ./services
      dockerfile: media-downloader-service/Dockerfile
    container_name: minabox-media-downloader
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Bound to localhost: not just /health hangs here but the whole download
      # API, and it is unauthenticated. The backend talks to the service over
      # the compose network (http://media-downloader:8007); diagnosis with curl
      # on the box stays possible.
      - "127.0.0.1:8007:8007"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL must be set in .env}
      - AUDIO_TRACKS_DIR=/mnt/audio/tracks
      - MAX_FILESIZE_MB=${MEDIA_DOWNLOADER_MAX_FILESIZE_MB:-200}
    volumes:
      - ${AUDIO_FILES_PATH:-./audio}:/mnt/audio
    networks:
      - minabox-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  minabox-network:
    driver: bridge
    name: minabox-network

volumes:
  mosquitto_data:
    name: minabox-mosquitto-data
  mosquitto_log:
    name: minabox-mosquitto-log
