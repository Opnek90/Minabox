name: Build & Push Images

# Builds the Minabox service images and pushes them to GHCR.
# The installer (install.sh) loads exclusively from there - without this
# workflow there is nothing to pull.
#
# A service is built only when its services/<name>-service/VERSION changes.
# An image tag is immutable, so re-publishing an unchanged service under its
# existing number would make the tag point at two different builds and the
# WebUI's version display worthless. See .github/scripts/select_services.py.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build all services, regardless of the changes"
        type: boolean
        default: true

# main is not cancelled: every run there is a release. Two merges in quick
# succession would otherwise let the first build die before it had pushed an
# image - and nobody would notice, because the second run was green and found
# nothing left to build for the unchanged service.
# On all other refs, cancelling still makes sense.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ── Do the changelog and manifest match? ─────────────────────────────────
  # Always runs, even when no service is built: a change to the changelog alone
  # should be checked too. If it fails, nothing is built - a release without
  # release notes is exactly what should be prevented.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changelog and manifest
        run: python3 scripts/build_manifest.py --check

  # ── Type check, lint, tests, i18n ────────────────────────────────────────
  # The same workflow every pull request runs. Hangs before build, so a red
  # run does not push an image to the registry.
  checks:
    uses: ./.github/workflows/checks.yml

  # ── Which services have to be built? ────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: without it there is no comparison point for the diff
          # against the previous state.
          fetch-depth: 0

      - name: Select services
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          BUILD_ALL: ${{ github.event_name != 'push' || inputs.build_all }}
        run: python3 .github/scripts/select_services.py

  # ── Build and push ─────────────────────────────────────────────────────
  build:
    needs: [validate, checks, changes]
    if: needs.changes.outputs.any == 'true'
    # A native arm64 runner. Not cosmetic: the led and button services compile
    # lgpio from source and webui builds with npm - under QEMU that takes many
    # times as long and runs into the job timeout.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version becomes the image tag *and* a build arg - the same number
      # is then in the registry and in the image's OCI label.
      - name: Read service version
        id: ver
        run: |
          set -euo pipefail
          file="services/${{ matrix.name }}-service/VERSION"
          version="$(tr -d '[:space:]' < "$file")"
          # Early, loud failure: a broken VERSION file would otherwise push an
          # image with a meaningless tag to the registry.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=$file::'$version' is not a valid SemVer version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      # A version tag is immutable. If it already exists and comes from a
      # different commit, the VERSION file was not bumped - then the run aborts
      # instead of overwriting the existing number. The same commit may pass:
      # that is a re-run of the same state.
      - name: Ensure version tag is free
        env:
          # A manual run is a deliberate decision - there the guard only warns.
          # On a push, a taken tag is a forgotten version bump and aborts the
          # run.
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          if ! out="$(docker buildx imagetools inspect "$ref" \
                --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null)"; then
            echo "Tag $ref is free."
            exit 0
          fi
          if [ "$out" = "${{ github.sha }}" ]; then
            echo "Tag $ref comes from this commit - a re-run, will be rewritten."
            exit 0
          fi
          msg="Version ${{ steps.ver.outputs.version }} of ${{ matrix.name }} is already taken (from commit ${out:-unknown}). Please bump services/${{ matrix.name }}-service/VERSION."
          if [ "$MANUAL" = "true" ]; then
            echo "::warning file=services/${{ matrix.name }}-service/VERSION::$msg Manual run - will be overwritten."
            exit 0
          fi
          echo "::error file=services/${{ matrix.name }}-service/VERSION::$msg"
          exit 1

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires lowercase paths.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # No "labels:" from metadata-action: its
          # org.opencontainers.image.version is derived from the git ref (so
          # "main" on a main push) and would overwrite the label the Dockerfile
          # sets from APP_VERSION. The labels belong to the Dockerfile here, so
          # a local build produces the same structure.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
