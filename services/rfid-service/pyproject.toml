[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minabox-rfid-service"
version = "0.1.0"
description = "Minabox RFID hardware integration service"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic>=2.9.0,<2.10.0",
    "structlog>=24.4.0,<24.5.0",
    "aiomqtt>=2.4.0,<2.5.0",
    "python-dotenv>=1.2.1,<1.3.0",
    "tenacity>=8.4.2,<8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
