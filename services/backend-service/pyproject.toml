[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-service"
version = "0.1.0"
description = "Minabox Backend Service - Central orchestration and data management"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.126.0,<0.127.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.12.0,<2.13.0",
    "sqlalchemy>=2.0.46,<2.1.0",
    "alembic>=1.15.0,<2.0.0",
    "aiomqtt>=2.5.0,<2.6.0",
    "structlog>=25.4.0,<25.5.0",
    "tenacity>=9.0.0,<10.0.0",
    "mutagen>=1.47.0,<2.0.0",
    "python-multipart>=0.0.18",
    "feedparser>=6.0.0,<7.0.0",
    "httpx>=0.28.0,<0.29.0",
    "bcrypt>=4.1.0,<6.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "minabox-shared @ file:../shared-lib",
]

[project.scripts]
backend-service = "backend_service.main:run"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "B008",   # FastAPI: Depends(), File(), Form() in defaults are OK
    "UP042",  # str+Enum is fine for Pydantic (StrEnum requires Python 3.11+)
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused re-exports in __init__ are OK

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
