[project]
name = "backend-service"
version = "0.1.0"
description = "Minabox Backend Service - Central orchestration and data management"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.126.0,<0.127.0",
    "uvicorn[standard]>=0.40.0,<0.41.0",
    "pydantic>=2.12.5,<3.0.0",
    "sqlalchemy>=2.0.46,<2.1.0",
    "alembic>=1.15.0,<2.0.0",
    "aiomqtt>=2.5.0,<3.0.0",
    "structlog>=25.4.0,<26.0.0",
    "tenacity>=9.1.0,<10.0.0",
    "mutagen>=1.47.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.0.0",
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
