[project]
name = "led_service"
version = "0.1.0"
description = "Minabox LED service for simple GPIO-based status LEDs."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.0,<2.13.0",
    "structlog>=25.4.0,<25.5.0",
    "gpiozero>=2.0.1,<2.1.0",
    "aiomqtt>=2.3.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "fastapi>=0.126.0,<0.130.0",
    "uvicorn[standard]>=0.41.0,<0.42.0",
]

# Entry point für python -m led_service
[project.scripts]
led-service = "led_service.main:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
