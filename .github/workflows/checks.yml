name: Checks

# Type check, lint, tests and the i18n guards for the WebUI service, plus the
# release manifest.
#
# Why standalone: build-images.yml builds images and only runs after the merge
# to main. A type error or a broken test could reach the registry unchecked.
# This workflow runs in two places - on every pull request, so the error is
# visible before the merge, and via workflow_call from build-images.yml, so a
# red run blocks the push.
#
# Runs on ubuntu-latest instead of the arm64 runner: npm ci and tsc need no
# special treatment there and the run costs about two minutes.

on:
  pull_request:
  workflow_call:

# The same exception as in build-images.yml: main must not be cancelled. This
# workflow hangs there as a workflow_call before the build - a cancelled run
# makes `needs: checks` fail and the build never starts.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The changelog, the manifest and the release candidates nobody promoted.
  # Cheap enough to run beside the WebUI job rather than after it: a release
  # commit is exactly the kind of pull request where the answer should be
  # there before anyone waits for npm.
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changelog, manifest and open candidates
        run: python3 scripts/build_manifest.py --check

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/webui-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/webui-service/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Dockerfile deliberately builds with build:fast, i.e. without tsc -
      # on the arm64 runner the type check costs minutes. It is done here.
      - name: Type check
        run: npm run build:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Otherwise missing translations only show up to the user: the key then
      # stands as raw text in the interface.
      - name: Locales in sync
        run: npm run check:locales

      - name: Translation keys exist
        run: npm run check:i18n-calls
