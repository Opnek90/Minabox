# Ruff configuration for Backend Service
target-version = "py313"
line-length = 100
indent-width = 4

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI: Depends(), File(), Form() in defaults are OK
    "UP042",  # str+Enum is fine for Pydantic (StrEnum requires Python 3.11+)
    "E501",   # Line too long (handled by formatter)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ are OK

[format]
quote-style = "double"
indent-style = "space"
